[project]
name = "hub-cli"
version = "0.1.0"
description = "N100 Service Hub CLI (hub)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
]

[project.scripts]
hub = "hub_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub_cli"]

[dependency-groups]
dev = ["pytest>=8"]
