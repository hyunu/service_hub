# N100 Service Hub 자체 배포 compose
#
# 보안 원칙 (docs/SECURITY.md):
#   * Docker 소켓은 backend에만 마운트한다. frontend에는 절대 마운트하지 않는다.
#   * 서비스(외부 앱) 데이터는 이 compose의 볼륨과 분리한다. hub는 /srv/services 아래
#     서비스 디렉터리에 대해서만 배포 작업을 허용한다(Phase 3).
#   * 관리 포트는 루프백/내부망에서만 접근한다. 외부 노출 시 방화벽 필수.
name: service-hub

services:
  backend:
    build:
      context: ./backend
    image: n100-service-hub-backend:0.1.0
    container_name: hub-backend
    restart: unless-stopped
    environment:
      HUB_BIND: 0.0.0.0          # 컨테이너 내부 바인딩 (호스트에서는 HUB_PORT만 노출)
      HUB_PORT: 8420
      HUB_DB_PATH: /data/hub.db
      HUB_STATUS_CACHE: /data/status.json
      # 배포 작업 디렉터리 (허브가 배포를 허용하는 범위). 컨테이너 내부 경로.
      HUB_DEPLOY_WORKDIR: /srv/services
      # 배포 게이트 기본 잠금. 열려면 .env에 HUB_ENABLE_DEPLOY=true (docs/SECURITY.md 확인)
      HUB_ENABLE_DEPLOY: "${HUB_ENABLE_DEPLOY:-false}"
      # 생체인식(WebAuthn) — HTTPS 보안 컨텍스트에서만 동작한다. 둘 다 설정해야 켜진다.
      # 예: HUB_WEBAUTHN_RP_ID=<tailnet FQDN>, HUB_WEBAUTHN_ORIGIN=https://<tailnet FQDN>
      HUB_WEBAUTHN_RP_ID: "${HUB_WEBAUTHN_RP_ID:-}"
      HUB_WEBAUTHN_ORIGIN: "${HUB_WEBAUTHN_ORIGIN:-}"
      # 컨테이너 안에서는 platform.node()가 컨테이너 ID를 반환한다.
      # 실제 호스트명을 표시하려면 .env에 HUB_HOST_HOSTNAME=<호스트명>을 넣는다.
      HUB_HOST_HOSTNAME: "${HUB_HOST_HOSTNAME:-}"
    volumes:
      - hub-data:/data
      - ${HUB_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${HUB_SERVICES_DIR:-/srv/services}:/srv/services:rw
    # Docker 소켓은 root:<docker GID> 소유다. 컨테이너 비루트 사용자가 접근하려면
    # 호스트 docker 그룹 GID를 보조 그룹으로 추가해야 한다 (기본값 988).
    group_add:
      - "${HUB_DOCKER_GID:-988}"
    ports:
      # 바인드 주소는 HUB_BIND 를 따른다. 기본은 루프백(127.0.0.1).
      # tailnet 전용 공개는 HUB_BIND=<tailscale IP> 로 설정한다 (docs/SECURITY.md).
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8420}:8420"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8420/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.hub.managed: "true"
      com.hub.self: "true"

  frontend:
    build:
      context: ./frontend
    image: n100-service-hub-frontend:0.1.0
    container_name: hub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 프런트엔드는 HUB_BIND 를 따른다. Docker 소켓은 마운트하지 않는다.
      # 기본 루프백. tailnet 전용 공개는 HUB_BIND=<tailscale IP> 로 설정한다.
      - "${HUB_BIND:-127.0.0.1}:8421:80"
    labels:
      com.hub.managed: "true"
      com.hub.self: "true"

volumes:
  hub-data:
    labels:
      com.hub.managed: "true"
