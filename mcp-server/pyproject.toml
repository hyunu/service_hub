[project]
name = "hub-mcp"
version = "0.1.0"
description = "N100 Service Hub MCP 서버 — AI 에이전트가 서비스 등록/배포/조회를 수행한다"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
hub-mcp = "hub_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
