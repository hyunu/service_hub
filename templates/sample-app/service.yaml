schema_version: 1
service:
  id: sample-app
  name: Sample Application
  description: |
    샘플 웹 애플리케이션. 신규 서비스 생성 시 이 템플릿을 복사해 사용합니다.
    서비스의 목적, 주요 기능, 사용자, 외부 접속 방법, 데이터 저장 위치,
    백업 방법, 운영상 주의사항을 이 설명에 기록하세요.
  category: web
  version: "1.0.0"
  documentation: README.md
  tags: [sample]
source:
  repository_url: ""
  branch: main
deployment:
  type: docker-compose
  compose_file: compose.yaml
endpoints:
  - name: frontend
    type: http
    exposure: proxy            # proxy: Traefik 도메인 / host: 직접 포트 / internal: Docker 내부 전용
    hostname: sample.home      # 내부 DNS/hosts 설정이 필요합니다 (자동 동작하지 않음)
    container: frontend
    container_port: 3000
containers:
  - name: frontend
    role: frontend
    required: true
    description: 웹 프런트엔드
  - name: backend
    role: backend
    required: true
    description: 애플리케이션 API
resources:
  memory_limit_mb: 1024
volumes:
  - name: sample-app-data
    purpose: 애플리케이션 영속 데이터
    backup_required: false
operations:
  healthcheck_required: true
  backup_required: false
  restart_policy: unless-stopped
security:
  expose_database: false
  required_env: [SAMPLE_SECRET_KEY]
